name: LPL Transfer Monitor

on:
  schedule:
    # 每 5 分钟运行一次 (GitHub 可能会稍有延迟)
    - cron: '*/5 * * * *'
  workflow_dispatch: # 允许你手动点击按钮运行

# 必须加这个，允许 Action 修改仓库里的快照文件
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          
      - name: 安装 Playwright 浏览器
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: 运行监控脚本
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          python weibo_monitor.py

      - name: 保存最新快照并提交回仓库
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自动更新微博快照 [Skip CI]"
          file_pattern: "weibo_snapshot.json"
          push_options: '--force'
